name: Build PR 5447 TUI portable x64

on:
  push:
    branches:
      - test-pr-5447-tui-portable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Portable TUI x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish NativeAOT portable build
        shell: pwsh
        run: |
          $OutputDir = Join-Path $PWD "artifacts/UniGetUI-Tui-win-x64"
          dotnet publish src/UniGetUI.Tui/UniGetUI.Tui.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -m:1 `
            -o $OutputDir

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed"
          }

          if (-not (Test-Path (Join-Path $OutputDir "UniGetUI.Tui.exe"))) {
            throw "UniGetUI.Tui.exe was not produced"
          }

          Get-ChildItem $OutputDir -Recurse | Select-Object FullName, Length

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniGetUI-PR5447-TUI-portable-win-x64
          path: artifacts/UniGetUI-Tui-win-x64/
          if-no-files-found: error
          retention-days: 7
