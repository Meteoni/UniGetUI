name: .NET Tests
on:
  push:
    branches: [ "main", "dialog-settings-ui-inter-font-ci" ]
    paths:
      - 'global.json'
      - '**.cs'
      - '**.axaml'
      - '**.csproj'
      - '**.props'
      - '**.targets'
      - '**.sln'
      - '**.slnx'
      - 'src/.editorconfig'
      - '.github/workflows/dotnet-test.yml'

  pull_request:
    branches: [ "main" ]
    paths:
      - 'global.json'
      - '**.cs'
      - '**.axaml'
      - '**.csproj'
      - '**.props'
      - '**.targets'
      - '**.sln'
      - '**.slnx'
      - 'src/.editorconfig'
      - '.github/workflows/dotnet-test.yml'

  workflow_dispatch:

jobs:
  test-codebase:
    runs-on: windows-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'src/**/*.csproj', 'src/**/*.props', 'src/**/*.targets', 'src/**/*.sln', 'src/**/*.slnx') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install dependencies
      working-directory: src
      run: dotnet restore UniGetUI.Windows.slnx

    - name: Check whitespace formatting
      run: dotnet format whitespace src --folder --verify-no-changes --verbosity minimal

    - name: Check code style formatting (Avalonia Windows solution)
      working-directory: src
      run: dotnet format style UniGetUI.Windows.slnx --no-restore --verify-no-changes --verbosity minimal

    - name: Build Avalonia Windows solution
      working-directory: src
      run: |
        dotnet build-server shutdown
        dotnet build UniGetUI.Windows.slnx --no-restore --verbosity minimal /p:Platform=x64 /p:UseSharedCompilation=false /m:1

    - name: Run Tests
      working-directory: src
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: dotnet test UniGetUI.Windows.slnx --no-restore --verbosity q --nologo /p:Platform=x64 /p:UseSharedCompilation=false /m:1

    - name: Report full-trim publish warnings
      working-directory: src
      shell: pwsh
      continue-on-error: true
      run: |
        dotnet build-server shutdown
        dotnet publish UniGetUI.Avalonia/UniGetUI.Avalonia.csproj `
          --no-restore `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          --output "${{ runner.temp }}\unigetui-full-trim-publish" `
          /p:Platform=x64 `
          /p:TrimMode=full `
          /p:TrimmerSingleWarn=false `
          /p:UseSharedCompilation=false `
          --verbosity minimal

    - name: Report NativeAOT publish warnings
      working-directory: src
      shell: pwsh
      run: |
        dotnet build-server shutdown
        dotnet restore UniGetUI.Avalonia/UniGetUI.Avalonia.csproj `
          --runtime win-x64 `
          /p:Configuration=Release `
          /p:PublishAot=true `
          /p:SelfContained=true
        dotnet publish UniGetUI.Avalonia/UniGetUI.Avalonia.csproj `
          --no-restore `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          --output "${{ runner.temp }}\unigetui-nativeaot-publish" `
          /m:1 `
          /p:Platform=x64 `
          /p:PublishProfile=Win-x64-NativeAot `
          /p:TrimmerSingleWarn=false `
          /p:UseSharedCompilation=false `
          --verbosity minimal
        if (-not (Test-Path "${{ runner.temp }}\unigetui-nativeaot-publish\UniGetUI.exe")) {
          throw "NativeAOT publish did not produce UniGetUI.exe."
        }

    - name: Package Windows x64 portable build
      shell: pwsh
      run: |
        $PublishDir = "${{ runner.temp }}\unigetui-nativeaot-publish"
        $Archive = "${{ runner.temp }}\UniGetUI.dialog-settings-ui-inter-font.win-x64.zip"
        Compress-Archive -Path "$PublishDir\*" -DestinationPath $Archive -CompressionLevel Optimal
        Compress-Archive -Path "InstallerExtras\ForceUniGetUIPortable" -DestinationPath $Archive -Update

    - name: Upload Windows x64 portable build
      uses: actions/upload-artifact@v7
      with:
        name: UniGetUI-dialog-settings-ui-inter-font-win-x64
        path: ${{ runner.temp }}\UniGetUI.dialog-settings-ui-inter-font.win-x64.zip


  build-non-windows:
    name: Build non-Windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'src/**/*.csproj', 'src/**/*.props', 'src/**/*.targets') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore Avalonia project
      working-directory: src
      run: dotnet restore UniGetUI.Avalonia/UniGetUI.Avalonia.csproj

    - name: Build Avalonia project
      working-directory: src
      run: dotnet build UniGetUI.Avalonia/UniGetUI.Avalonia.csproj --no-restore --configuration Debug --verbosity minimal


  publish-linux-x64:
    name: Publish Ubuntu/Linux x64
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      UNIGETUI_GITHUB_CLIENT_ID: ${{ secrets.UNIGETUI_GITHUB_CLIENT_ID }}
      UNIGETUI_GITHUB_CLIENT_SECRET: ${{ secrets.UNIGETUI_GITHUB_CLIENT_SECRET }}
      UNIGETUI_OPENSEARCH_USERNAME: ${{ secrets.UNIGETUI_OPENSEARCH_USERNAME }}
      UNIGETUI_OPENSEARCH_PASSWORD: ${{ secrets.UNIGETUI_OPENSEARCH_PASSWORD }}

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: Linux-publish-nuget-${{ hashFiles('global.json', 'src/**/*.csproj', 'src/**/*.props', 'src/**/*.targets') }}
        restore-keys: |
          Linux-publish-nuget-
          Linux-nuget-

    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /opt/ghc || true
        df -h /

    - name: Build Linux cross-compilation image
      shell: bash
      run: |
        set -euo pipefail
        SDK_TAG="$(jq -er '.sdk.version' global.json)"
        docker build --pull --build-arg "SDK_TAG=$SDK_TAG" -t unigetui-cross-build - <<'DOCKERFILE'
        ARG SDK_TAG
        FROM mcr.microsoft.com/dotnet/sdk:${SDK_TAG} AS sdk
        FROM mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-amd64
        COPY --from=sdk /usr/share/dotnet /usr/share/dotnet
        ENV DOTNET_ROOT=/usr/share/dotnet
        ENV PATH=/usr/share/dotnet:$PATH
        ENV DOTNET_NOLOGO=true
        DOCKERFILE

    - name: Set test version
      shell: pwsh
      run: ./scripts/set-version.ps1 -Version 2026.9.20-interfont

    - name: Publish Linux x64 NativeAOT
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p bin/linux-x64
        DOCKER_ARGS=(
          --rm
          --user "$(id -u):$(id -g)"
          --volume "${{ github.workspace }}:/source"
          --workdir /source/src
          --env HOME=/tmp
          --env DOTNET_CLI_HOME=/tmp
          --env NUGET_PACKAGES=/source/.nuget/packages
          --env UNIGETUI_GITHUB_CLIENT_ID
          --env UNIGETUI_GITHUB_CLIENT_SECRET
          --env UNIGETUI_OPENSEARCH_USERNAME
          --env UNIGETUI_OPENSEARCH_PASSWORD
        )
        PUBLISH_ARGS=(
          publish UniGetUI.Avalonia/UniGetUI.Avalonia.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output ../bin/linux-x64
          /p:PublishProfile=linux-x64-NativeAot
          /p:SysRoot=/crossrootfs/x64
          /p:LinkerFlavor=lld
          /p:TrimmerSingleWarn=false
          /p:UseSharedCompilation=false
          --verbosity minimal
        )
        docker run "${DOCKER_ARGS[@]}" unigetui-cross-build dotnet "${PUBLISH_ARGS[@]}"
        test -x bin/linux-x64/UniGetUI

    - name: Verify Linux glibc baseline
      shell: pwsh
      run: ./scripts/check-linux-glibc.ps1 -Path "bin/linux-x64" -MaxVersion '2.27'

    - name: Package Ubuntu artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path output | Out-Null

        & tar -czf "output/UniGetUI.inter-font.linux-x64.tar.gz" -C "bin/linux-x64" .
        if ($LASTEXITCODE -ne 0) { exit 1 }

        & ./scripts/package-linux.ps1 `
          -PackageType deb `
          -SourceDir "bin/linux-x64" `
          -OutputPath "output/UniGetUI.inter-font.linux-x64.deb" `
          -Version "2026.9.20~interfont" `
          -Architecture amd64

        if (-not (Test-Path "output/UniGetUI.inter-font.linux-x64.tar.gz")) { throw "tar.gz was not created" }
        if (-not (Test-Path "output/UniGetUI.inter-font.linux-x64.deb")) { throw ".deb was not created" }

    - name: Upload Ubuntu/Linux x64 artifacts
      uses: actions/upload-artifact@v7
      with:
        name: UniGetUI-inter-font-linux-x64
        path: |
          output/UniGetUI.inter-font.linux-x64.tar.gz
          output/UniGetUI.inter-font.linux-x64.deb
